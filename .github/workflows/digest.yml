name: Weekly digest

on:
  schedule:
    - cron: "0 22 * * 6"   # Sat 22:00 UTC = Sun 07:00 JST (weekly). Edit to taste.
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit seen.json back

concurrency:                # two overlapping runs would overwrite each other's seen.json
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      - name: Save seen list
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add seen.json
          if ! git diff --staged --quiet; then
            git commit -m "update seen list"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 5
            done
            echo "::error::could not push seen.json, so already-sent items may be sent again"
            exit 1
          fi
